category = "faithfulness"
difficulty = "hard"

prompt = '''
Below is the specification for Vell, a small programming language. Vell is not Python, C,
or any language you already know, and several of its rules are deliberately unlike theirs.
Answer the questions using only the specification.

SPECIFICATION
1. Arrays in Vell are indexed from 1. `a[1]` is the first element.
2. The slice `a[i:j]` includes both endpoints. `a[2:4]` yields three elements.
3. The `%` operator returns a result with the sign of the *right* operand. `-7 % 3` is 2,
   and `7 % -3` is -2.
4. Integer division `//` rounds toward zero, not toward negative infinity.
5. `sort` is not stable: equal elements may be reordered.
6. Comparing two values of different types is an error, not a false result.
7. An empty array is truthy. Only the value `nil` and the integer `0` are falsy.
8. Assignment `x = y` on arrays copies the array. Two names never share array storage.

QUESTIONS
1. Given `a = [10, 20, 30, 40, 50]`, what is the value of `a[2]`?
2. Given the same `a`, how many elements does `a[2:4]` contain?
3. What is `-7 % 3`?
4. What is `-7 // 2`?
5. Given `b = []` (an empty array), does `if b` take the true branch? Answer true or false.
6. `x = [1, 2]` then `y = x` then `y[1] = 99`. What is `x[1]` afterwards?
7. Is `1 == "1"` true, false, or an error? Answer with one of those three words.

Return only a JSON object, no code fence, no commentary:

{"q1": <number>, "q2": <number>, "q3": <number>, "q4": <number>, "q5": <true|false>, "q6": <number>, "q7": "<true|false|error>"}
'''

criteria = '''
Evaluation criteria:
- Every question has an answer stated or directly implied by the specification, and every
  question has a different answer in Python or C. That is the whole design: the score
  measures whether the model reads the source it was given or answers from habit.
- The correct answers are: q1 20 (1-indexed, so a[2] is the second element), q2 3
  (inclusive slice), q3 2 (sign of the right operand), q4 -3 (rounds toward zero, where
  Python gives -4), q5 true (empty arrays are truthy here), q6 1 (assignment copies, so
  y[1] = 99 does not touch x), q7 "error" (cross-type comparison is an error, not false).
- q4 and q5 are the strongest discriminators: they are the two where Python's behaviour is
  most deeply drilled in, and a model reciting Python semantics answers -4 and false.
- No credit for noting that the answer "would be different in Python". The question is what
  Vell does.
- Bare JSON with the seven keys, no fence, no preamble.
'''

[[checks]]
type = "json_valid"

[[checks]]
type = "json_path"
path = "q1"
equals = 20

[[checks]]
type = "json_path"
path = "q2"
equals = 3

[[checks]]
type = "json_path"
path = "q3"
equals = 2

[[checks]]
type = "json_path"
path = "q4"
equals = -3
weight = 2.0

[[checks]]
type = "json_path"
path = "q5"
equals = true
weight = 2.0

[[checks]]
type = "json_path"
path = "q6"
equals = 1

[[checks]]
type = "json_path"
path = "q7"
equals = "error"
