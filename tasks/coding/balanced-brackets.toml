category = "coding"
difficulty = "easy"

prompt = """
Write a Python function called `is_balanced` that takes a string and returns True if all brackets in it are correctly balanced and nested, and False otherwise.

Consider three bracket types: `()`, `[]`, and `{}`. Any other characters in the string should be ignored.

Requirements:
- Include type hints
- Handle the empty string
- Brackets must be closed in the correct order: `([)]` is not balanced

Examples:
  is_balanced("(a[b]{c})") => True
  is_balanced("([)]")      => False
  is_balanced("(")         => False
"""

criteria = """
Evaluation criteria:
- Function named is_balanced taking a string, returning a bool
- Uses a stack (or equivalent) so that nesting order is checked, not just counts
- Non-bracket characters are ignored rather than causing failure
- Empty string returns True
- Unclosed and unopened brackets both return False
- Type hints present
- Code is syntactically valid, runnable Python
"""

[[checks]]
type = "code_exec"
suite = "suites/balanced_brackets_test.py"
